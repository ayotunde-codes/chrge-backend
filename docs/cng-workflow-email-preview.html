<!doctype html><html><head><meta charset="utf-8"><title>CHRGE CNG workflow email previews</title><style>body{margin:0;background:#eef4ef;color:#17211b;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:40px 20px}h1{margin:0 0 8px}.lead{color:#65736b;margin:0 0 30px}.email{background:#fff;border:1px solid #d9e6dc;border-radius:18px;padding:28px;margin:18px 0;box-shadow:0 8px 28px #173c2410}.brand{color:#087a50;font-size:12px;font-weight:800;letter-spacing:.1em}.email h2{font-size:24px;margin:16px 0 10px}.email p{color:#526159;line-height:1.6}.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #edf2ee}.row span{color:#65736b}.row b{text-align:right}.button{display:inline-block;margin-top:20px;background:#12c77c;color:#082c1c;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:800}</style></head><body><main class="wrap"><h1>CHRGE CNG workflow emails</h1><p class="lead">Staging preview of all customer lifecycle notifications.</p><div id="emails"></div></main><script>const samples=[['Vehicle inspection booked','Your CHRGE vehicle inspection appointment has been scheduled.',['Date and time','Monday, 5 October 2026 at 10:00 WAT'],['Conversion centre','CHRGE Yaba Centre, Lagos']],['Financing approved — deposit required','Your financing is approved. Sign in to your dashboard to review the plan and initiate your deposit payment.',['Deposit due','₦300,000']],['Deposit confirmed','We have confirmed your deposit. CHRGE will now arrange your conversion appointment.'],['CNG conversion scheduled','Your vehicle conversion appointment has been booked.',['Date and time','Thursday, 8 October 2026 at 09:00 WAT'],['Conversion centre','CHRGE Yaba Centre, Lagos']],['Financing disbursed','Your financing has been disbursed and your CNG conversion has been paid for.'],['CNG conversion complete','Your vehicle conversion has been recorded as completed. Your weekly repayment schedule is available in your dashboard.'],['Financing fully paid','Congratulations—your CNG conversion financing has been fully repaid. Thank you for choosing CHRGE. We encourage you to share CHRGE with other drivers ready for cleaner, more affordable mobility.']];document.querySelector('#emails').innerHTML=samples.map(([title,intro,...rows])=>`<section class="email"><div class="brand">CHRGE · STAGING</div><h2>${title}</h2><p>${intro}</p>${rows.map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="row"><span>Application</span><b>CNG-2026-DEMO1234</b></div><a class="button">View dashboard</a></section>`).join('');</script></body></html>
