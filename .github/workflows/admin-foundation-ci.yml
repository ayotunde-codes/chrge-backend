name: Backend admin foundation CI
on:
  pull_request:
  push:
    branches: [dev, main, admin-operations-portal]
permissions: { contents: read, security-events: write }
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: chrge_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint -- --no-fix
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chrge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/chrge_test
